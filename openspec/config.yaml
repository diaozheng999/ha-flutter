schema: spec-driven-decisions

context: |
  Tech stack: Flutter/Dart
  Target platforms: Android, Windows
  Deferred platforms: iOS, macOS (no toolchain — directories exist for future use)
  Backend: Home Assistant REST API and WebSocket
  State management: TBD
  Architecture: TBD

rules:
  specs:
    - Use Given/When/Then format for scenarios
  decisions:
    - Append an entry the moment a decision is made; never batch at the end
    - Every entry needs a Why and at least one Alternative considered
    - Supersede with a new dated entry; never edit or delete past entries
